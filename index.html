<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio-ArmenRifai</title>
  
  <link rel="icon" type="image/png" href="Gambar/logo.png" />

  <style>
    *{
      margin:0; padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body{
      background:#111;
      overflow:hidden;
    }

    /* CONTAINER UTAMA */
    .container{
      width: 100vw; height: 100vh;
      background:#f3f3f3; padding: 30px 0;
      position:relative; overflow:hidden;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    /* NAVBAR */
    .navbar{
      display:flex; justify-content:space-between; align-items:center;
      position: relative; z-index: 100; padding: 0 40px; 
    }

    .logo a { text-decoration: none; color: #000; font-size:24px; font-weight:900; }
    .menu { display:flex; gap:50px; }
    .menu a { text-decoration:none; color:#000; font-weight:800; font-size:18px; }

    /* SLIDER WRAPPER */
    .slider-wrapper{
      width:100%; height: calc(100vh - 160px); 
      display:flex; align-items:center; position: relative;
      cursor:grab; overflow: hidden; 
      touch-action: pan-y;
    }

    .slider{
      display:flex; gap:25px; 
      width:max-content; will-change: transform;
    }

    /* CARD STYLE BASE */
    .card{
      width: 440px; 
      height: calc(90vh - 180px);
      background:#d9d9d9;
      position:relative; overflow:hidden;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
    }

    .card:hover{
      transform: scale(1.02);
    }

    .card-link {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }

    .card img{ 
      width:100%; height:100%; 
      object-fit:cover; pointer-events: none; 
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* EFEK REVEAL INSTAN */
    .card.reveal-smooth {
      opacity: 1 !important;
      clip-path: inset(0% 0 0% 0) !important; 
      transform: scale(1) !important;
      pointer-events: auto !important;
    }

    .card.reveal-smooth img {
      transform: scale(1) !important;
    }

    /* FOOTER */
    .footer-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 40px; height: 40px;
    }
    .footer-left { display: flex; align-items: center; gap: 20px; }
    .scroll-text { font-size: 14px; font-weight: 700; text-transform: uppercase; }
    .progress-container { width: 150px; height: 2px; background: rgba(0,0,0,0.1); position: relative; overflow: hidden;}
    .progress-bar { position: absolute; width: 40px; height: 100%; background: #000; }
    .title { font-size: 28px; font-weight: 900; text-transform: uppercase; }

    /* RESPONSIVE MOBILE BREAKPOINTS */
    @media(max-width:768px){
      body { overflow-y: auto; }
      .container { height: auto; padding: 20px 0; }

      .logo{
        font-size:18px;
      }

      .navbar, .footer-bar { padding: 0 20px; }
      .menu { gap: 20px; }
      .menu a { font-size: 14px; }
      
      .slider-wrapper { height: calc(100vh - 120px); }
      .slider { gap: 15px; }
      .card { 
        width: 280px; 
        height: calc(80vh - 120px); 
      }
      
      .slider.entrance-active .card { 
        opacity: 1 !important; 
        transform: none !important; 
        clip-path: none !important; 
      }
      .slider.entrance-active .card img { transform: none !important; }
      .card.reveal-smooth { opacity: 1 !important; clip-path: none !important; transform: none !important; }
      
      .footer-bar { padding: 0 20px; }
      .title { font-size: 18px; }
      .scroll-text, .progress-container { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="navbar">
      <div class="logo"><a href="index.html" class="page-link">ARMEN RIFAI HASIBUAN</a></div>
      <div class="menu">
        <a href="index.html" class="page-link" style="border-bottom: 2px solid #000;">WORKS</a>
        <a href="about.html" class="page-link">ABOUT</a>
        <a href="contact.html" class="page-link">CONTACT</a>
        </div>
    </div>

    <div class="slider-wrapper" id="sliderWrapper">
      <div id="initialCardsTemplate" style="display:none;">
        
        <div class="card" data-title="HUCA">
          <a href="huca.html" class="page-link card-link">
            <img src="Gambar/hucacover.jpg">
          </a>
        </div>

        <div class="card" data-title="BARBIE">
          <a href="barbie.html" class="page-link card-link">
            <img src="Gambar/Barbie-01.jpg">
          </a>
        </div>

        <div class="card" data-title="COMEHOME">
          <a href="comehome.html" class="page-link card-link">
            <img src="Gambar/ch5.png">
          </a>
        </div>

        <div class="card" data-title="LA FIAMMANTE">
          <a href="Lafiammante.html" class="page-link card-link">
            <img src="Gambar/coverwebsitelafiammante.png">
          </a>
        </div>

        <div class="card" data-title="THE CENTRE STAGE">
          <a href="thecentrestage.html" class="page-link card-link">
            <img src="Gambar/thecentrestagecoverwebsite.png">
          </a>
        </div>
        
        <div class="card" data-title="SECARI">
          <a href="secari.html" class="page-link card-link">
            <img src="Gambar/coverwebsitesecari.png">
          </a>
        </div>

        <div class="card" data-title="GRAB">
          <a href="grab.html" class="page-link card-link">
            <img src="Gambar/grab.coverwebsite.png">
          </a>
        </div>

        <div class="card" data-title="BY CHANCE">
          <a href="bychance.html" class="page-link card-link">
            <img src="Gambar/by chance-01.jpg">
          </a>
        </div>

        <div class="card" data-title="SUMI SPACE">
          <a href="sumispace.html" class="page-link card-link">
            <img src="Gambar/sumicover.png">
          </a>
        </div>
        
        <div class="card" data-title="KRENK ASS">
          <a href="yusman.html" class="page-link card-link">
            <img src="Gambar/yusman-01.jpg">
          </a>
        </div>

        <div class="card" data-title="B.P. de Silva Jewellers">
          <a href="BPDESILVE.html" class="page-link card-link">
            <img src="Gambar/coverbpdesilver.png">
          </a>
        </div>

        <div class="card" data-title="RISE OF THE SNEAKERS">
          <a href="ROTS.html" class="page-link card-link">
            <img src="Gambar/ROTS2.jpg">
          </a>
        </div>

      </div>

      <div class="slider" id="sliderTrack"></div>
    </div>

    <div class="footer-bar">
      <div class="footer-left">
        <span class="scroll-text">Scroll / Drag</span>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <div class="footer-right"><div class="title" id="dynamicTitle">HUCA</div></div>
    </div>
  </div>

  <script>
    const track = document.getElementById('sliderTrack');
    const template = document.getElementById('initialCardsTemplate');
    const progressBar = document.getElementById('progressBar');
    const dynamicTitle = document.getElementById('dynamicTitle');
    
    const originalCount = template.children.length;
    let cards = [];

    let isMobile = window.innerWidth <= 768;
    let cardWidth = isMobile ? 280 : 440;
    let gap = isMobile ? 15 : 25;
    let originalSetWidth = originalCount * (cardWidth + gap);
    let startOffset = isMobile ? 20 : 40;

    let targetX = -originalSetWidth + startOffset;
    let currentX = targetX;

    function buildSliderTrack() {
      track.innerHTML = ''; 
      const masterCards = Array.from(template.children).map(c => c.cloneNode(true));
      
      const cloneLeft = masterCards.map(c => c.cloneNode(true)).reverse();
      const cloneRight = masterCards.map(c => c.cloneNode(true));
      
      masterCards.forEach(c => track.appendChild(c));
      cloneRight.forEach(c => track.appendChild(c));
      cloneLeft.forEach(c => track.insertBefore(c, track.firstChild));
      
      cards = document.querySelectorAll('.card');
      
      setupCardHoverEvents();
    }

    function setupCardHoverEvents() {
      cards.forEach(card => {
        card.addEventListener('mouseenter', () => {
          const newTitle = card.getAttribute('data-title');
          if (dynamicTitle && newTitle) {
            dynamicTitle.innerText = newTitle;
          }
        });
      });
    }

    window.addEventListener('resize', () => {
      isMobile = window.innerWidth <= 768;
      cardWidth = isMobile ? 280 : 440;
      gap = isMobile ? 15 : 25;
      originalSetWidth = originalCount * (cardWidth + gap);
      startOffset = isMobile ? 20 : 40;
    });

    let isAnimatingEntrance = false; 

    function triggerCarlosReveal() {
      buildSliderTrack(); 
      setupPageLinks();

      // Langsung munculkan semua kartu tanpa efek tirai berantai
      track.classList.remove('entrance-active');
      cards.forEach(card => card.classList.add('reveal-smooth'));
      
      targetX = -originalSetWidth + startOffset;
      currentX = targetX;
      track.style.transform = `translate3d(${currentX}px, 0, 0)`;
      
      isAnimatingEntrance = false; 
    }

    function triggerCarlosExit(callback) {
      // Langsung eksekusi perpindahan halaman tanpa animasi penutup
      callback(); 
    }

    function setupPageLinks() {
      document.querySelectorAll('.page-link').forEach(link => {
        link.removeEventListener('click', handleLinkClick);
        link.addEventListener('click', handleLinkClick);
      });
    }

    function handleLinkClick(e) {
      if (dragDistanceAccumulated > 10) {
        e.preventDefault();
        return;
      }

      const destination = this.getAttribute('href');
      
      if (destination === '#' || (destination === 'index.html' && (location.pathname.includes('index.html') || location.pathname === '/'))) {
        e.preventDefault();
        triggerCarlosReveal();
        return;
      }

      e.preventDefault();
      triggerCarlosExit(() => {
        window.location.href = destination;
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      triggerCarlosReveal(); // Langsung dipanggil tanpa delay timeout
    });

    let isDragging = false, startMouseX = 0, dragStart = 0;
    let dragDistanceAccumulated = 0;

    const getClientX = (e) => e.touches ? e.touches[0].clientX : e.pageX;

    const dragStartHandler = (e) => {
      if(isAnimatingEntrance) return; 
      isDragging = true; 
      track.style.cursor = 'grabbing';
      startMouseX = getClientX(e); 
      dragStart = targetX;
      dragDistanceAccumulated = 0;
    };

    const dragMoveHandler = (e) => {
      if(!isDragging || isAnimatingEntrance) return;
      const currentMouseX = getClientX(e);
      
      const deltaX = currentMouseX - startMouseX;
      dragDistanceAccumulated += Math.abs(deltaX);

      const sensitivity = isMobile ? 2.0 : 1.5; 
      targetX = dragStart + deltaX * sensitivity;
    };

    const dragEndHandler = () => { 
      isDragging = false; 
      track.style.cursor = 'grab'; 
    };

    window.addEventListener('mousedown', dragStartHandler);
    window.addEventListener('mousemove', dragMoveHandler);
    window.addEventListener('mouseup', dragEndHandler);

    window.addEventListener('touchstart', dragStartHandler, { passive: true });
    window.addEventListener('touchmove', dragMoveHandler, { passive: true });
    window.addEventListener('touchend', dragEndHandler);

    window.addEventListener('wheel', e => {
      if(isAnimatingEntrance) return; 
      if(e.target.closest('#sliderWrapper')) {
        targetX -= e.deltaY * 0.8;
      }
    }, {passive: true});

    function loop() {
      currentX += (targetX - currentX) * 0.08;

      const limit = originalSetWidth;
      if (currentX <= -originalSetWidth * 2) { currentX += limit; targetX += limit; }
      if (currentX >= 0) { currentX -= limit; targetX -= limit; }

      if (track) {
        track.style.transform = `translate3d(${currentX}px, 0, 0)`;
      }
      
      if(!isMobile && progressBar) {
        const p = (Math.abs(currentX + originalSetWidth - startOffset) % originalSetWidth) / originalSetWidth;
        progressBar.style.transform = `translateX(${p * 110}px)`;
      }
      
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
